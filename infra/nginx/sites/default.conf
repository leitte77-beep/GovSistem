# HTTP → HTTPS redirect
server {
    listen 80;
    server_name govsistem.com.br admin.govsistem.com.br api.govsistem.com.br chatgov.govsistem.com.br govsocial.govsistem.com.br govtask.govsistem.com.br govdoc.govsistem.com.br frota.govsistem.com.br app.govsistem.com.br auth.govsistem.com.br;

    # Desafio ACME do certbot (webroot) — responde ANTES do redirect (que vive
    # em location /: return em nível de server roda na fase de rewrite, antes
    # da seleção de location, e engoliria o desafio).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# API
server {
    listen 443 ssl http2;
    server_name api.govsistem.com.br;

    ssl_certificate /etc/nginx/ssl/live/govsistem.com.br/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/govsistem.com.br/privkey.pem;

    location /api/v1/health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location /api/v1/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /metrics {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

