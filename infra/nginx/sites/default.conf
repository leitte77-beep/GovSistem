# HTTP → HTTPS redirect
server {
    listen 80;
    server_name govsistem.com.br admin.govsistem.com.br api.govsistem.com.br chatgov.govsistem.com.br govsocial.govsistem.com.br govtask.govsistem.com.br;
    return 301 https://$server_name$request_uri;
}

# API
server {
    listen 443 ssl http2;
    server_name api.govsistem.com.br;

    ssl_certificate /etc/nginx/ssl/live/govsistem.com.br/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/govsistem.com.br/privkey.pem;

    location /api/v1/health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location /api/v1/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /metrics {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Admin (SaaS Platform)
server {
    listen 443 ssl http2;
    server_name admin.govsistem.com.br;

    ssl_certificate /etc/nginx/ssl/live/govsistem.com.br/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/govsistem.com.br/privkey.pem;

    location /_next/static {
        proxy_pass http://172.17.0.1:9002;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://172.17.0.1:9002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

