# ChatGov
server {
    listen 443 ssl http2;
    server_name chatgov.govsistem.com.br;

    ssl_certificate /etc/nginx/ssl/live/govsistem.com.br/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/govsistem.com.br/privkey.pem;

    # WebSocket
    location /socket.io/ {
        proxy_pass http://172.17.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # WebSocket chat
    location /ws/ {
        proxy_pass http://172.17.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # Preview de documentos (PDF, imagem, video) do chat interno e dos protocolos.
    # Mesma excecao do /media/ logo abaixo: o frontend abre estes arquivos em
    # <iframe>/<embed>, e o X-Frame-Options DENY (nginx.conf antigo) somado ao
    # frame-ancestors 'none' do backend faz o Chrome exibir "A conexao com
    # chatgov.govsistem.com.br foi recusada".
    # Location regex tem precedencia sobre o prefixo /api/, por isso o proxy
    # e repetido aqui.
    location ~ ^/api/evolucoes/arquivos/[^/]+/(raw|download)$ {
        proxy_pass http://172.17.0.1:3050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Cabecalhos duplicados sao resolvidos pelo navegador pela regra mais
        # restritiva: sem esconder os do upstream, o preview continua bloqueado.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-XSS-Protection;

        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # Backend API
    location /api/ {
        proxy_pass http://172.17.0.1:3050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Backend media files
    location /media/ {
        proxy_pass http://172.17.0.1:3050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O X-Frame-Options DENY global (nginx.conf) bloqueia o preview de
        # documentos, que o frontend abre em iframe/embed -> o Chrome mostra
        # "A conexao com chatgov.govsistem.com.br foi recusada".
        # add_header aqui substitui TODOS os headers herdados, entao os demais
        # de seguranca sao repetidos abaixo.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;

        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Frontend SPA (static assets + fallback)
    location / {
        proxy_pass http://172.17.0.1:3051;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# GovSocial
server {
    listen 443 ssl http2;
    server_name govsocial.govsistem.com.br;

    ssl_certificate /etc/nginx/ssl/live/govsistem-farol/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/govsistem-farol/privkey.pem;

    location /api/govsocial/ {
        proxy_pass http://host.docker.internal:8202;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # WebSocket do chat. A rota /ws/chat/{tenant_id} e registrada na raiz da
    # API (include_router(chat_router) sem prefixo), fora do /api/govsocial/ —
    # sem este bloco a conexao cai no location / (frontend estatico) e falha.
    location /ws/ {
        proxy_pass http://host.docker.internal:8202;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass http://host.docker.internal:7501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# GovDoc
server {
    listen 443 ssl http2;
    server_name govdoc.govsistem.com.br;

    ssl_certificate /etc/nginx/ssl/live/govsistem-farol/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/govsistem-farol/privkey.pem;

    client_max_body_size 512m;

    # Tudo vai para o nginx do próprio módulo (web), que encaminha /api/ para
    # o backend internamente — o mesmo padrão dos demais módulos.
    location / {
        proxy_pass http://host.docker.internal:43001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}


# GovFrota
server {
    listen 443 ssl http2;
    server_name frota.govsistem.com.br;

    # Certificado dedicado emitido para frota.govsistem.com.br.
    ssl_certificate /etc/nginx/ssl/live/frota.govsistem.com.br/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/frota.govsistem.com.br/privkey.pem;

    # Fotos de abastecimento e notas fiscais
    client_max_body_size 32m;

    location /api/govfrota/ {
        proxy_pass http://govfrota-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /_next/static {
        proxy_pass http://govfrota-web:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://govfrota-web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# GovTask
server {
    listen 443 ssl http2;
    server_name govtask.govsistem.com.br;

    # O cert govsistem-farol cobre govtask.govsistem.com.br (SAN).
    ssl_certificate /etc/nginx/ssl/live/govsistem-farol/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/govsistem-farol/privkey.pem;

    client_max_body_size 128m;

    # API: govtask-api e govtask-web nao publicam portas no host, entao o
    # proxy usa o nome do servico na rede interna do compose.
    location /api/govtask/ {
        proxy_pass http://govtask-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
