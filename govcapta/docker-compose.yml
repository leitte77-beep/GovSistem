services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: govcapta
      POSTGRES_USER: govcapta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "15434:5432"
    volumes:
      - govcapta-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govcapta -d govcapta"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6381:6379"
    volumes:
      - govcapta-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://govcapta:${POSTGRES_PASSWORD}@postgres:5432/govcapta
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8300:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  govcapta-postgres:
  govcapta-redis:

