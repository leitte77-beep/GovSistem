[project]
name = "govsaude-api"
version = "0.1.0"
description = "GovSaúde — backend multi-tenant da gestão da saúde pública municipal"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "email-validator>=2.1",
  "PyJWT>=2.8",
  "bcrypt>=4.1",
  "cryptography>=42",
  "redis>=5.0",
  "celery>=5.3",
  "httpx>=0.27",
  "minio>=7.2",
  "openpyxl>=3.1",
  "weasyprint>=62",
  "Jinja2>=3.1",
  "pyotp>=2.9",
  "python-multipart>=0.0.9",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "alembic/versions", "openapi.json"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"app/core/config.py" = ["N802", "E501"]
"app/core/errors.py" = ["N818"]
"app/models/*" = ["E501"]
"tests/*" = ["E501", "N803"]
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "postgres: exige PostgreSQL real (GOVSAUDE_TEST_POSTGRES_URL)",
]
