# nginx interno do container: serve a SPA estática do GovSocial.
# O roteamento de /api/govsocial e TLS é feito pelo nginx da infra (borda).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compressão ──
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;

    # ── Security headers ──
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # /assets/v2/ serve o MESMO diretorio de /assets/. O prefixo existe para
    # invalidar cache: os imports dentro dos bundles sao relativos, entao basta
    # o index.html apontar para /assets/v2/ que a arvore inteira muda de URL.
    #
    # Foi preciso porque o dist e remendado a mao (ver backups/govsocial-web-*):
    # o conteudo de um chunk mudou sem o hash do nome mudar, e o antigo
    # `immutable` de 365d fazia o navegador nunca mais pedir o arquivo.
    # Ao trocar o dist de novo, incrementar para /assets/v3/ aqui e no index.html.
    location /assets/v2/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "no-cache";
    }

    # Caminho antigo: mantido para nao dar 404 em paginas ja abertas.
    location /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA: qualquer rota cai no index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
