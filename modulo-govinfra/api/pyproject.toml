[project]
name = "govinfra-api"
version = "1.0.0"
description = "GovInfra — módulo de gestão dos serviços, equipamentos e atendimentos da Secretaria Municipal de Infraestrutura"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 110
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"app/core/config.py" = ["N802", "E501"]
"app/core/database.py" = ["N806"]
"app/api/v1/router.py" = ["I001"]
"app/core/auth.py" = ["N818"]
"app/core/errors.py" = ["N818"]
"app/services/banco_horas.py" = ["N818"]
"app/services/combustivel.py" = ["N818"]
"app/api/v1/pessoas.py" = ["E501"]
"app/api/v1/solicitacoes.py" = ["E501"]
"scripts/seed.py" = ["E501"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
