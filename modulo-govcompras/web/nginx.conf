server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64m;

    # SPA: qualquer rota cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A API roda em outro container do mesmo stack — o frontend fala sempre
    # com caminho relativo (/api/govcompras/...), nunca com URL absoluta,
    # então nada precisa ser recompilado ao mudar de ambiente.
    location /api/govcompras/ {
        proxy_pass http://api:8000/api/govcompras/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
