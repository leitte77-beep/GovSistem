# GovCompras — Gestão Integrada de Compras, Licitações e Contratos
#
#   docker compose -p govcompras up -d
#
# Bloco de portas reservado: 45000-45699 (próximo livre após govdoc 43xxx e
# govinfra 44xxx — confirmado sem conflito com nenhum outro módulo do
# monorepo antes de reservar).
#
# Sem Redis/MinIO nesta POC: nenhuma feature implementada hoje depende de
# fila/cache, e documentos são metadados (upload de binário é próxima fase) —
# adicionar esses serviços antes de haver uso real seria complexidade morta.

name: govcompras

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-govcompras}
      POSTGRES_USER: ${POSTGRES_USER:-govcompras_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-govcompras_password}
    volumes:
      - govcompras_pgdata:/var/lib/postgresql/data
    ports:
      # Exposto ao host apenas para facilitar migrations e inspeção local.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-45501}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-govcompras_user} -d ${POSTGRES_DB:-govcompras}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [govcompras]

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file:
      - .env.local
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-govcompras}
      POSTGRES_USER: ${POSTGRES_USER:-govcompras_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-govcompras_password}
      DATABASE_URL_OVERRIDE: ""
      PUBLIC_URL: ${GOVCOMPRAS_PUBLIC_URL:-http://127.0.0.1:45001}
      CORS_ORIGINS: ${GOVCOMPRAS_PUBLIC_URL:-http://127.0.0.1:45001},http://127.0.0.1:${FRONTEND_PORT:-45001},http://localhost:${FRONTEND_PORT:-45001}
      API_PORT: ${API_PORT:-45101}
      FRONTEND_PORT: ${FRONTEND_PORT:-45001}
      SAAS_API_URL: ${SAAS_API_URL:-http://host.docker.internal:9009/api/v1}
      SAAS_JWT_SECRET: ${SAAS_JWT_SECRET:-}
      SECRET_KEY: ${SECRET_KEY:-}
      # Ponte de login de demonstração (seção 128) — nunca ligar em produção.
      ENABLE_DEV_LOGIN: ${ENABLE_DEV_LOGIN:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${API_PORT:-45101}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/govcompras/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks: [govcompras]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      # Publicado em 0.0.0.0 para o nginx da borda (govcompras.govsistem.com.br)
      # alcançar via host.docker.internal, como os demais módulos do sistema.
      - "${FRONTEND_PORT:-45001}:80"
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks: [govcompras]

volumes:
  govcompras_pgdata:

networks:
  govcompras:
    driver: bridge
