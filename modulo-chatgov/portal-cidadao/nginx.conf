server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Uploads de documentos pelo cidadão.
    client_max_body_size 25m;

    # Cabeçalhos de segurança para o portal público.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A API pública do protocolo. Sem este proxy o portal carrega a tela mas
    # nenhuma consulta funciona — o front chama /api/v1/public/*.
    # Só a superfície pública é exposta aqui: as rotas internas de operação
    # (/api/v1/protocols) não são roteadas a partir do portal.
    location /api/v1/public/ {
        proxy_pass http://backend:3050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
