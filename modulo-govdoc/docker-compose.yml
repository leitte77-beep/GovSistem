# GovDoc — Gestão de Documentos
#
# Suba sempre por `npm run docker:up`: o script resolve as portas livres e grava
# o arquivo `.env.ports` que este compose consome. Assim nenhum serviço tenta
# publicar uma porta já usada por outro módulo do sistema.
#
#   docker compose -p govdoc --env-file .env.ports -f docker-compose.yml up -d
#
# Serviços internos conversam pelo nome (postgres, redis, minio). Só as portas
# publicadas no host passam pela verificação de conflito.

name: govdoc

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-govdoc}
      POSTGRES_USER: ${POSTGRES_USER:-govdoc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-govdoc_password}
    volumes:
      - govdoc_pgdata:/var/lib/postgresql/data
    ports:
      # Exposto ao host apenas para facilitar migrations e inspeção local.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-43501}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-govdoc_user} -d ${POSTGRES_DB:-govdoc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [govdoc]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - govdoc_redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-43601}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [govdoc]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-govdoc_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-govdoc_minio_secret}
    volumes:
      - govdoc_miniodata:/data
    ports:
      - "127.0.0.1:${STORAGE_API_PORT:-43301}:9000"
      - "127.0.0.1:${STORAGE_CONSOLE_PORT:-43201}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [govdoc]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set govdoc http://minio:9000 ${S3_ACCESS_KEY:-govdoc_minio} ${S3_SECRET_KEY:-govdoc_minio_secret}
        mc mb --ignore-existing govdoc/${S3_BUCKET:-govdoc-documents}
        mc anonymous set none govdoc/${S3_BUCKET:-govdoc-documents}
        exit 0
    networks: [govdoc]

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file:
      - .env.local
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-govdoc}
      POSTGRES_USER: ${POSTGRES_USER:-govdoc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-govdoc_password}
      DATABASE_URL_OVERRIDE: ""
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-govdoc-documents}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-govdoc_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-govdoc_minio_secret}
      BACKUP_DESTINATION: /backups
      PUBLIC_URL: ${GOVDOC_PUBLIC_URL:-http://127.0.0.1:43001}
      CORS_ORIGINS: ${GOVDOC_PUBLIC_URL:-http://127.0.0.1:43001},http://127.0.0.1:${FRONTEND_PORT:-43001},http://localhost:${FRONTEND_PORT:-43001}
      API_PORT: ${API_PORT:-43101}
      SAAS_API_URL: ${SAAS_API_URL:-http://host.docker.internal:9009/api/v1}
      ENABLE_DEV_SAAS_AUTH: ${ENABLE_DEV_SAAS_AUTH:-false}
      ENABLE_DEV_E2E_AUTH: ${ENABLE_DEV_E2E_AUTH:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - govdoc_backups:/backups
    ports:
      - "127.0.0.1:${API_PORT:-43101}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/govdoc/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks: [govdoc]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Em branco = caminhos relativos (o nginx do próprio módulo encaminha
        # /api/ para o backend). Funciona tanto em 127.0.0.1 quanto no subdomínio.
        VITE_GOVDOC_API_URL: ${GOVDOC_PUBLIC_URL:-}
        VITE_ENABLE_SAAS_LOGIN: ${VITE_ENABLE_SAAS_LOGIN:-false}
    ports:
      # Publicado em 0.0.0.0 para o nginx da borda (govdoc.govsistem.com.br)
      # alcançar via host.docker.internal, como os demais módulos.
      - "${FRONTEND_PORT:-43001}:80"
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks: [govdoc]

  # Antivírus opcional: `docker compose --profile antivirus up -d`
  clamav:
    image: clamav/clamav:stable
    profiles: [antivirus]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    restart: unless-stopped
    networks: [govdoc]

volumes:
  govdoc_pgdata:
  govdoc_redisdata:
  govdoc_miniodata:
  govdoc_backups:

networks:
  govdoc:
    driver: bridge
